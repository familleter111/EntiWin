worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    client_max_body_size 10m;

    upstream nextjs_upstream {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    server {
        listen 8080;
        server_name _;

        # Filenames under /_next/static are content-hashed by Next.js, so it's
        # safe (and faster) for nginx to serve them straight from disk instead
        # of round-tripping through the Node process.
        location /_next/static/ {
            alias /app/.next/static/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for App Router streaming (Suspense/loading.tsx): flush
            # chunks to the client as Next.js produces them.
            proxy_buffering off;
            proxy_read_timeout 90s;
        }
    }
}
